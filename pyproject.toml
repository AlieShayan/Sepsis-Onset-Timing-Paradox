[project]
name = "sepsis-onset-timing-paradox"
version = "1.0.1"
description = "When Does Sepsis Prediction Precede Treatment? Retrospective Onset Mechanics, EHR Timelines, and Bedside Alert Workload in ICU Benchmarks"
authors = [
    { name = "Alireza Shayan", email = "Ali404@hafez.shirazu.ac.ir" },
    { name = "Somayeh Afrasiabi", email = "afrasiabi@shirazu.ac.ir" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyarrow>=10.0.0",
    "fastparquet>=2023.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
